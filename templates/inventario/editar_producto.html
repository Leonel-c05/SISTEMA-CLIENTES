{% extends 'base.html' %}

{% block title %}
Actualizar Producto
{% endblock %}

{% block content %}

<h1 class="mb-4">Actualizar Producto</h1>

<form method="POST">

    <!-- PRODUCTO -->
    <div class="mb-3">

        <label>Nombre del Producto</label>

        <input
            type="text"
            name="nombre_producto"
            class="form-control"
            value="{{ producto.nombre_producto }}"
            required
        >

    </div>

    <!-- MARCA -->
    <div class="mb-3">

        <label>Marca</label>

        <input
            type="text"
            name="marca"
            class="form-control"
            value="{{ producto.marca }}"
            placeholder="Ejemplo: ASUS, MSI, Kingston, AMD..."
            required
        >

    </div>

    <!-- DESCRIPCIÓN -->
    <div class="mb-3">

        <label>Descripción</label>

        <textarea
            name="descripcion"
            class="form-control"
            rows="3"
        >{{ producto.descripcion }}</textarea>

    </div>

    <!-- CATEGORÍA -->
    <div class="mb-3">

        <label>Categoría</label>

        <select
            name="categoria"
            class="form-select"
            required
        >

            <option value="Memoria RAM"
                {% if producto.categoria == "Memoria RAM" %}selected{% endif %}>
                Memoria RAM
            </option>

            <option value="Almacenamiento"
                {% if producto.categoria == "Almacenamiento" %}selected{% endif %}>
                Almacenamiento
            </option>

            <option value="Procesador"
                {% if producto.categoria == "Procesador" %}selected{% endif %}>
                Procesador
            </option>

            <option value="Tarjeta Gráfica"
                {% if producto.categoria == "Tarjeta Gráfica" %}selected{% endif %}>
                Tarjeta Gráfica
            </option>

            <option value="Tarjeta Madre"
                {% if producto.categoria == "Tarjeta Madre" %}selected{% endif %}>
                Tarjeta Madre
            </option>

            <option value="Fuente de Poder"
                {% if producto.categoria == "Fuente de Poder" %}selected{% endif %}>
                Fuente de Poder
            </option>

            <option value="Periféricos"
                {% if producto.categoria == "Periféricos" %}selected{% endif %}>
                Periféricos
            </option>

            <option value="Accesorios"
                {% if producto.categoria == "Accesorios" %}selected{% endif %}>
                Accesorios
            </option>

            <option value="Pantallas"
                {% if producto.categoria == "Pantallas" %}selected{% endif %}>
                Pantallas
            </option>

            <option value="Otros"
                {% if producto.categoria == "Otros" %}selected{% endif %}>
                Otros
            </option>

        </select>

    </div>

    <!-- STOCK -->
    <div class="mb-3">

        <label>Stock</label>

        <input
            type="number"
            name="stock"
            class="form-control"
            value="{{ producto.stock }}"
            required
        >

    </div>

    <!-- PRECIO -->
    <div class="mb-3">

        <label>Precio</label>

        <input
            type="number"
            step="0.01"
            name="precio"
            class="form-control"
            value="{{ producto.precio }}"
            required
        >

    </div>

    <button type="submit" class="btn btn-warning">
        Actualizar Producto
    </button>

    <a href="/inventario" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
