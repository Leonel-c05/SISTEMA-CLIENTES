<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>
        {% block title %}
        Sistema de Gestión de Servicio Técnico
        {% endblock %}
    </title>

</head>


<body class="bg-slate-100">

<div class="flex min-h-screen">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">


        <!-- ENCABEZADO -->

        <div class="px-8 py-8 border-b border-slate-200">

            <h1 class="text-xl font-semibold text-slate-800">

                Sistema de Gestión

            </h1>

            <p class="mt-1 text-sm text-slate-500">

                Servicio Técnico

            </p>

        </div>


        <!-- =========================================
             MENÚ
        ========================================== -->

        <nav class="flex-1 py-4">


            <!-- INICIO -->

            <a
                href="/"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Inicio

            </a>


            <!-- =====================================
                 OPCIONES SOLO ADMINISTRADOR
            ====================================== -->

            {% if session.get('rol') == 'Administrador' %}


                <!-- DASHBOARD -->

                <a
                    href="/dashboard"
                    class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
                >

                    Dashboard

                </a>


            {% endif %}


            <!-- CLIENTES -->

            <a
                href="/clientes"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Clientes

            </a>


            <!-- EQUIPOS -->

            <a
                href="/equipos"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Equipos

            </a>


            <!-- INVENTARIO -->

            <a
                href="/inventario"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Inventario

            </a>


            <!-- =====================================
                 USUARIOS SOLO ADMINISTRADOR
            ====================================== -->

            {% if session.get('rol') == 'Administrador' %}

                <a
                    href="/usuarios"
                    class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
                >

                    Usuarios

                </a>

            {% endif %}


            <!-- SERVICIOS TÉCNICOS -->

            <a
                href="/servicios"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Servicios Técnicos

            </a>


        </nav>


        <!-- =========================================
             CERRAR SESIÓN
        ========================================== -->

        <div class="border-t border-slate-200 p-4">

            <a
                href="/logout"
                class="block w-full text-center rounded-lg border border-red-300 text-red-600 py-3 hover:bg-red-50 transition"
            >

                Cerrar sesión

            </a>

        </div>


    </aside>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="flex-1 p-10">

        {% block content %}

        {% endblock %}

    </main>


</div>


</body>

</html>
