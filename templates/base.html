<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>{% block title %}Sistema de Gestión de Servicio Técnico{% endblock %}</title>

</head>

<body class="bg-slate-100">

<div class="flex min-h-screen">

    <!-- Sidebar -->

    <aside class="w-64 bg-white border-r border-slate-200">

        <div class="px-8 py-8 border-b border-slate-200">

            <h1 class="text-xl font-semibold text-slate-800">

                Sistema de Gestión

            </h1>

            <p class="mt-1 text-sm text-slate-500">

                Servicio Técnico

            </p>

        </div>

        <nav class="py-4">

            <a
                href="/"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Inicio

            </a>

            <a
                href="/clientes"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Clientes

            </a>

            <a
                href="/equipos"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Equipos

            </a>

            <a
                href="/inventario"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Inventario

            </a>

            <a
                href="/usuarios"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Usuarios

            </a>

            <a
                href="/servicios"
                class="block px-8 py-3 text-slate-700 hover:bg-slate-100 transition"
            >

                Servicios Técnicos

            </a>

        </nav>

    </aside>

    <!-- Contenido -->

    <main class="flex-1 p-10">

        {% block content %}
        {% endblock %}

    </main>

</div>
</body>

</html>
