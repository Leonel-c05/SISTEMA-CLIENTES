<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Iniciar Sesión</title>

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white border border-slate-200 rounded-2xl shadow-lg p-10">

            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-slate-800">

                    Sistema de Gestión

                </h1>

                <p class="text-slate-500 mt-2">

                    Servicio Técnico

                </p>

            </div>
{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

{% endwith %}
            <form method="POST">

                <div class="mb-5">

                    <label class="block text-sm font-medium text-slate-700 mb-2">

                        Usuario

                    </label>

                    <input
                        type="text"
                        name="usuario"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-800"
                    >

                </div>

                <div class="mb-6">

                    <label class="block text-sm font-medium text-slate-700 mb-2">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-800"
                    >

                </div>

                <button
                    type="submit"
                    class="w-full bg-slate-900 text-white py-3 rounded-lg hover:bg-slate-800 transition"
                >

                    Iniciar Sesión

                </button>

            </form>

            <div class="mt-6 text-center">

                <a
                    href="/recuperar-password"
                    class="text-sm text-slate-600 hover:text-slate-900"
                >

                    ¿Olvidó su contraseña?

                </a>

            </div>

        </div>

    </div>

</body>

</html>
