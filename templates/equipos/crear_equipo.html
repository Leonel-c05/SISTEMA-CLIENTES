{% extends 'base.html' %}

{% block title %}
Registrar Equipo
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">

        <div class="border-b border-slate-200 px-8 py-6">

            <h1 class="text-2xl font-semibold text-slate-800">

                Registrar Equipo

            </h1>

            <p class="mt-1 text-sm text-slate-500">

                Ingrese la información del equipo.

            </p>

        </div>

        <form method="POST" class="p-8 space-y-6">

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Cliente

                </label>

                <select
                    name="id_cliente"
                    required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >

                    <option value="">

                        Seleccione un cliente

                    </option>

                    {% for cliente in clientes %}

                    <option value="{{ cliente.id_cliente }}">

                        {{ cliente.nombre }} {{ cliente.apellido }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Tipo de Equipo

                    </label>

                    <input
                        type="text"
                        name="tipo_equipo"
                        placeholder="Ej. Laptop"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Marca

                    </label>

                    <input
                        type="text"
                        name="marca"
                        placeholder="Ej. HP"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Modelo

                    </label>

                    <input
                        type="text"
                        name="modelo"
                        placeholder="Ej. Pavilion 15"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Número de Serie

                    </label>

                    <input
                        type="text"
                        name="numero_serie"
                        placeholder="Ingrese el número de serie"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Observaciones

                </label>

                <textarea
                    name="observaciones"
                    rows="4"
                    placeholder="Ingrese observaciones del equipo..."
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 resize-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                ></textarea>

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Estado

                </label>

                <select
                    name="estado"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >

                    <option value="Recibido">Recibido</option>
                    <option value="En revisión">En revisión</option>
                    <option value="Reparando">Reparando</option>
                    <option value="Entregado">Entregado</option>

                </select>

            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">

                <a
                    href="/equipos"
                    class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 transition"
                >

                    Cancelar

                </a>

                <button
                    type="submit"
                    class="px-5 py-2.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition"
                >

                    Guardar Equipo

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
