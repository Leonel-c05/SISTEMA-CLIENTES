{% extends 'base.html' %}

{% block title %}
Nuevo Servicio Técnico
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">
                🔧 Registrar Servicio Técnico
            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Equipo

                    </label>

                    <select
                        name="id_equipo"
                        class="form-select"
                        required
                    >

                        <option value="">

                            Seleccione un equipo

                        </option>

                        {% for equipo in equipos %}

                        <option value="{{ equipo.id_equipo }}">

                            {{ equipo.marca }} {{ equipo.modelo }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Técnico Responsable

                    </label>

                    <select
                        name="id_usuario"
                        class="form-select"
                        required
                    >

                        <option value="">

                            Seleccione un técnico

                        </option>

                        {% for usuario in usuarios %}

                        <option value="{{ usuario.id_usuario }}">

                            {{ usuario.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Falla Reportada

                    </label>

                    <textarea
                        name="falla_reportada"
                        class="form-control"
                        rows="3"
                        required
                    ></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Diagnóstico

                    </label>

                    <textarea
                        name="diagnostico"
                        class="form-control"
                        rows="3"
                    ></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Solución

                    </label>

                    <textarea
                        name="solucion"
                        class="form-control"
                        rows="3"
                    ></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Estado

                    </label>

                    <select
                        name="estado"
                        class="form-select"
                        required
                    >

                        <option value="Recibido">Recibido</option>

                        <option value="En Diagnóstico">En Diagnóstico</option>

                        <option value="Reparando">Reparando</option>

                        <option value="Finalizado">Finalizado</option>

                        <option value="Entregado">Entregado</option>

                    </select>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Fecha de Ingreso

                        </label>

                        <input
                            type="date"
                            name="fecha_ingreso"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Fecha de Entrega

                        </label>

                        <input
                            type="date"
                            name="fecha_entrega"
                            class="form-control"
                        >

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Costo

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        name="costo"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        Guardar Servicio

                    </button>

                    <a
                        href="/servicios"
                        class="btn btn-secondary"
                    >

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
