{% extends 'base.html' %}

{% block title %}
Editar Servicio Técnico
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">

        <div class="border-b border-slate-200 px-8 py-6">

            <h1 class="text-2xl font-semibold text-slate-800">

                Editar Servicio Técnico

            </h1>

            <p class="mt-1 text-sm text-slate-500">

                Modifique la información del servicio técnico.

            </p>

        </div>

        <form method="POST" class="p-8 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Equipo

                    </label>

                    <select
                        name="id_equipo"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                        {% for equipo in equipos %}

                        <option
                            value="{{ equipo.id_equipo }}"
                            {% if equipo.id_equipo == servicio.id_equipo %}selected{% endif %}
                        >

                            {{ equipo.marca }} {{ equipo.modelo }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Técnico Responsable

                    </label>

                    <select
                        name="id_usuario"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                        {% for usuario in usuarios %}

                        <option
                            value="{{ usuario.id_usuario }}"
                            {% if usuario.id_usuario == servicio.id_usuario %}selected{% endif %}
                        >

                            {{ usuario.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Falla Reportada

                </label>

                <textarea
                    name="falla_reportada"
                    rows="3"
                    required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 resize-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >{{ servicio.falla_reportada }}</textarea>

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Diagnóstico

                </label>

                <textarea
                    name="diagnostico"
                    rows="3"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 resize-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >{{ servicio.diagnostico }}</textarea>

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Solución

                </label>

                <textarea
                    name="solucion"
                    rows="3"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 resize-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >{{ servicio.solucion }}</textarea>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Estado

                    </label>

                    <select
                        name="estado"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                        <option value="Recibido" {% if servicio.estado == "Recibido" %}selected{% endif %}>Recibido</option>

                        <option value="En Diagnóstico" {% if servicio.estado == "En Diagnóstico" %}selected{% endif %}>En Diagnóstico</option>

                        <option value="Reparando" {% if servicio.estado == "Reparando" %}selected{% endif %}>Reparando</option>

                        <option value="Finalizado" {% if servicio.estado == "Finalizado" %}selected{% endif %}>Finalizado</option>

                        <option value="Entregado" {% if servicio.estado == "Entregado" %}selected{% endif %}>Entregado</option>

                    </select>

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Fecha de Ingreso

                    </label>

                    <input
                        type="date"
                        name="fecha_ingreso"
                        value="{{ servicio.fecha_ingreso }}"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Fecha de Entrega

                    </label>

                    <input
                        type="date"
                        name="fecha_entrega"
                        value="{{ servicio.fecha_entrega }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

            </div>

            <div class="max-w-sm">

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Costo del Servicio

                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="costo"
                    value="{{ servicio.costo }}"
                    required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >

            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">

                <a
                    href="/servicios"
                    class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 transition"
                >

                    Cancelar

                </a>

                <button
                    type="submit"
                    class="px-5 py-2.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition"
                >

                    Actualizar Servicio

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
