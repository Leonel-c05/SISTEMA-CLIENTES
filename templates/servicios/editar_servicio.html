{% extends 'base.html' %}

{% block title %}
Editar Servicio Técnico
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-warning">

            <h4 class="mb-0">
                ✏️ Editar Servicio Técnico
            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Equipo

                    </label>

                    <select
                        name="id_equipo"
                        class="form-select"
                        required
                    >

                        {% for equipo in equipos %}

                        <option
                            value="{{ equipo.id_equipo }}"
                            {% if equipo.id_equipo == servicio.id_equipo %}selected{% endif %}
                        >

                            {{ equipo.marca }} {{ equipo.modelo }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Técnico Responsable

                    </label>

                    <select
                        name="id_usuario"
                        class="form-select"
                        required
                    >

                        {% for usuario in usuarios %}

                        <option
                            value="{{ usuario.id_usuario }}"
                            {% if usuario.id_usuario == servicio.id_usuario %}selected{% endif %}
                        >

                            {{ usuario.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Falla Reportada

                    </label>

                    <textarea
                        name="falla_reportada"
                        class="form-control"
                        rows="3"
                        required
                    >{{ servicio.falla_reportada }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Diagnóstico

                    </label>

                    <textarea
                        name="diagnostico"
                        class="form-control"
                        rows="3"
                    >{{ servicio.diagnostico }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Solución

                    </label>

                    <textarea
                        name="solucion"
                        class="form-control"
                        rows="3"
                    >{{ servicio.solucion }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Estado

                    </label>

                    <select
                        name="estado"
                        class="form-select"
                        required
                    >

                        <option value="Recibido" {% if servicio.estado == "Recibido" %}selected{% endif %}>Recibido</option>

                        <option value="En Diagnóstico" {% if servicio.estado == "En Diagnóstico" %}selected{% endif %}>En Diagnóstico</option>

                        <option value="Reparando" {% if servicio.estado == "Reparando" %}selected{% endif %}>Reparando</option>

                        <option value="Finalizado" {% if servicio.estado == "Finalizado" %}selected{% endif %}>Finalizado</option>

                        <option value="Entregado" {% if servicio.estado == "Entregado" %}selected{% endif %}>Entregado</option>

                    </select>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Fecha de Ingreso

                        </label>

                        <input
                            type="date"
                            name="fecha_ingreso"
                            class="form-control"
                            value="{{ servicio.fecha_ingreso }}"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Fecha de Entrega

                        </label>

                        <input
                            type="date"
                            name="fecha_entrega"
                            class="form-control"
                            value="{{ servicio.fecha_entrega }}"
                        >

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Costo

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        name="costo"
                        class="form-control"
                        value="{{ servicio.costo }}"
                        required
                    >

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-warning"
                    >

                        Actualizar Servicio

                    </button>

                    <a
                        href="/servicios"
                        class="btn btn-secondary"
                    >

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
