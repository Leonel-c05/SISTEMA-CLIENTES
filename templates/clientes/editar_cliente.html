{% extends 'base.html' %}

{% block title %}
Editar Cliente
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">

        <div class="border-b border-slate-200 px-8 py-6">

            <h1 class="text-2xl font-semibold text-slate-800">

                Editar Cliente

            </h1>

            <p class="mt-1 text-sm text-slate-500">

                Actualice la información del cliente seleccionado.

            </p>

        </div>

        <form method="POST" class="p-8 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Cédula

                    </label>

                    <input
                        type="text"
                        name="cedula"
                        value="{{ cliente.cedula }}"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Teléfono

                    </label>

                    <input
                        type="text"
                        name="telefono"
                        value="{{ cliente.telefono }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Nombre

                    </label>

                    <input
                        type="text"
                        name="nombre"
                        value="{{ cliente.nombre }}"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm font-medium text-slate-700">

                        Apellido

                    </label>

                    <input
                        type="text"
                        name="apellido"
                        value="{{ cliente.apellido }}"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                    >

                </div>

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Dirección

                </label>

                <input
                    type="text"
                    name="direccion"
                    value="{{ cliente.direccion }}"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >

            </div>

            <div>

                <label class="block mb-2 text-sm font-medium text-slate-700">

                    Correo Electrónico

                </label>

                <input
                    type="email"
                    name="correo"
                    value="{{ cliente.correo }}"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition"
                >

            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">

                <a
                    href="/clientes"
                    class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 transition"
                >

                    Cancelar

                </a>

                <button
                    type="submit"
                    class="px-5 py-2.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition"
                >

                    Actualizar Cliente

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
