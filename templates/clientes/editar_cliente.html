{% extends 'base.html' %}

{% block title %}
Editar Cliente
{% endblock %}

{% block content %}

<h1 class="mb-4">Editar Cliente</h1>

<form method="POST">

    <div class="mb-3">
        <label>Cédula</label>
        <input 
            type="text" 
            name="cedula" 
            class="form-control"
            value="{{ cliente.cedula }}"
            required
        >
    </div>

    <div class="mb-3">
        <label>Nombre</label>
        <input 
            type="text" 
            name="nombre" 
            class="form-control"
            value="{{ cliente.nombre }}"
            required
        >
    </div>

    <div class="mb-3">
        <label>Apellido</label>
        <input 
            type="text" 
            name="apellido" 
            class="form-control"
            value="{{ cliente.apellido }}"
            required
        >
    </div>

    <div class="mb-3">
        <label>Teléfono</label>
        <input 
            type="text" 
            name="telefono" 
            class="form-control"
            value="{{ cliente.telefono }}"
        >
    </div>

    <div class="mb-3">
        <label>Dirección</label>
        <input 
            type="text" 
            name="direccion" 
            class="form-control"
            value="{{ cliente.direccion }}"
        >
    </div>

    <div class="mb-3">
        <label>Correo</label>
        <input 
            type="email" 
            name="correo" 
            class="form-control"
            value="{{ cliente.correo }}"
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Actualizar Cliente
    </button>

</form>

{% endblock %}
