{% extends 'base.html' %}

{% block title %}
Nuevo Usuario
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">
                👤 Registrar Usuario
            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Nombre Completo

                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Usuario

                    </label>

                    <input
                        type="text"
                        name="usuario"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Correo Electrónico

                    </label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Rol

                    </label>

                    <select
                        name="rol"
                        class="form-select"
                        required
                    >

                        <option value="">

                            Seleccione un rol

                        </option>

                        <option value="Administrador">

                            Administrador

                        </option>

                        <option value="Técnico">

                            Técnico

                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >

                    Guardar Usuario

                </button>

                <a
                    href="/usuarios"
                    class="btn btn-secondary"
                >

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
